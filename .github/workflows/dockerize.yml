name: Dockerize

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dockerize:
    uses: specify/workflows/.github/workflows/dockerize.yml@main
    with:
      registry-service: specifyconsortium/report-runner
    secrets:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}
