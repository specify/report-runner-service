name: Dockerize

on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: dockerize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify packaged report rendering on Jetty EE8
        run: mvn -B -ntp verify

  dockerize:
    if: github.event_name != 'schedule'
    needs: verify
    uses: specify/workflows/.github/workflows/dockerize.yml@main
    with:
      registry-service: specifyconsortium/report-runner
    secrets:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  weekly:
    if: github.event_name == 'schedule' && github.repository == 'specify/report-runner-service'
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      IMAGE: specifyconsortium/report-runner
      DEFAULT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Rebuild latest and the two newest stable releases
        run: |
          releases=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' | sed -n '1,2p' || true)
          failed=0
          for ref in "$DEFAULT_SHA" $releases; do
            tag="$ref-weekly"
            if [ "$ref" = "$DEFAULT_SHA" ]; then tag=latest; fi
            git checkout --detach "$ref"
            if ! docker buildx build --pull --no-cache \
              --platform linux/amd64,linux/arm64 \
              --tag "$IMAGE:$tag" --push .; then
              echo "::error::Failed to rebuild $tag"
              failed=1
            fi
          done
          exit "$failed"
